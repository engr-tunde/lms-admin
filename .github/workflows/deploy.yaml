name: Deploy Admin to Azure

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
permissions:
  id-token: write
  contents: read

jobs:
  dockerize:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          echo "=== DEBUG: Checking secrets ==="
          echo "Current branch: ${{ github.ref }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Environment input: ${{ github.event.inputs.environment }}"
          echo ""
          echo "=== DEV ACR Secrets ==="
          echo "DEV_ACR_REGISTRY: ${{ secrets.DEV_ACR_REGISTRY }}"
          echo "DEV_ACR_USERNAME: ${{ secrets.DEV_ACR_USERNAME }}"
          echo "DEV_ACR_PASSWORD: ${{ secrets.DEV_ACR_PASSWORD }}"
          echo "DEV_ACR_IMAGE_NAME: ${{ secrets.DEV_ACR_IMAGE_NAME }}"
          echo "DEV_API_SERVER: ${{ secrets.DEV_API_SERVER }}"
          echo ""
          echo "=== PROD ACR Secrets ==="
          echo "PROD_ACR_REGISTRY: ${{ secrets.PROD_ACR_REGISTRY }}"
          echo "PROD_ACR_USERNAME: ${{ secrets.PROD_ACR_USERNAME }}"
          echo "PROD_ACR_PASSWORD: ${{ secrets.PROD_ACR_PASSWORD }}"
          echo "PROD_ACR_IMAGE_NAME: ${{ secrets.PROD_ACR_IMAGE_NAME }}"
          echo "PROD_API_SERVER: ${{ secrets.PROD_API_SERVER }}"
          echo ""
          
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "dev" ]]; then
            echo "Setting up DEV environment..."
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "registry=${{ secrets.DEV_ACR_REGISTRY }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.DEV_ACR_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.DEV_ACR_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "image_name=${{ secrets.DEV_ACR_REGISTRY }}/${{ secrets.DEV_ACR_IMAGE_NAME }}" >> $GITHUB_OUTPUT
            echo "api_server=${{ secrets.DEV_API_SERVER }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "Setting up PROD environment..."
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "registry=${{ secrets.PROD_ACR_REGISTRY }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.PROD_ACR_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.PROD_ACR_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "image_name=${{ secrets.PROD_ACR_REGISTRY }}/${{ secrets.PROD_ACR_IMAGE_NAME }}" >> $GITHUB_OUTPUT
            echo "api_server=${{ secrets.PROD_API_SERVER }}" >> $GITHUB_OUTPUT
          else
            echo "No valid environment detected"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.set-env.outputs.registry }}
          username: ${{ steps.set-env.outputs.username }}
          password: ${{ steps.set-env.outputs.password }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.set-env.outputs.image_name }}:${{ github.ref_name }}
            ${{ steps.set-env.outputs.image_name }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ steps.set-env.outputs.api_server }}

  deploy:
    needs: dockerize
    runs-on: ubuntu-latest
    environment: ${{ needs.dockerize.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        run: |
          if [[ "${{ needs.dockerize.outputs.environment }}" == "dev" ]]; then
            az login --service-principal \
              --username ${{ secrets.AZURE_CLIENT_ID_DEV }} \
              --password ${{ secrets.AZURE_CLIENT_SECRET_DEV }} \
              --tenant ${{ secrets.AZURE_TENANT_ID_DEV }}
          else
            az login --service-principal \
              --username ${{ secrets.AZURE_CLIENT_ID_PROD }} \
              --password ${{ secrets.AZURE_CLIENT_SECRET_PROD }} \
              --tenant ${{ secrets.AZURE_TENANT_ID_PROD }}
          fi

      - name: Deploy to Azure
        run: |
          if [[ "${{ needs.dockerize.outputs.environment }}" == "dev" ]]; then
            echo "Deploying to DEV environment..."
            az containerapp update \
              --name ${{ secrets.DEV_ACA_NAME }} \
              --resource-group ${{ secrets.DEV_RESOURCE_GROUP }} \
              --image ${{ secrets.DEV_ACR_REGISTRY }}/${{ secrets.DEV_ACR_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }} \
              --revision-suffix $(date +%s)
          else
            echo "Deploying to PROD environment..."
            az container restart \
              --name ${{ secrets.PROD_ACI_NAME }} \
              --resource-group ${{ secrets.PROD_RESOURCE_GROUP }}
          fi 
